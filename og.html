<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Swift Chat</title>
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
.card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 420px; align-items: start; padding: 128px 0 0 76px; box-sizing: border-box; }
h1 { margin: 0; font-size: 60px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; max-width: 13ch; }
p { margin: 22px 0 0; font-size: 22px; line-height: 1.4; color: #6e6e73; max-width: 22em; }
.by { margin-top: 26px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: #111; }
.by svg { width: 26px; height: 26px; }
.phone { --w: 340px; --pad: calc(var(--w) * 18 / 1206); position: relative; width: calc(var(--w) + 2 * var(--pad)); aspect-ratio: 1242 / 2658; margin-top: 122px; filter: drop-shadow(0 30px 50px rgba(0,0,0,.22)); }
.phone .rail { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; }
.phone .clip { position: absolute; inset: 0; -webkit-mask: url(assets/iphone-screen-mask.png) center / 100% 100% no-repeat; mask: url(assets/iphone-screen-mask.png) center / 100% 100% no-repeat; background: #000; }
.phone img.shot { position: absolute; inset: var(--pad); width: calc(100% - 2 * var(--pad)); height: calc(100% - 2 * var(--pad)); object-fit: cover; }
</style></head>
<body><div class="card">
  <div>
    <h1>iMessage, rebuilt line for line. Now it’s one SwiftUI view.</h1>
    <p>Tails, typing dots, Delivered fading into Read, a keyboard you drag with your finger. iOS 18+.</p>
    <div class="by"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#007aff" d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.4-2.1c1.1.3 2.3.5 3.6.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>swiftchat.app</div>
  </div>
  <div class="phone"><div class="clip"><img class="shot" src="assets/img/conversation-poster.jpg" alt=""></div><img class="rail" src="assets/iphone-rail.png" alt=""></div>
</div></body></html>
